name: Publish Fairway V3
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch V3 index
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/ardu01/app-golf-v3/main/index.html -o index.html
          python3 -c "from pathlib import Path; p=Path('index.html'); t=p.read_text(); t=t.replace('https://raw.githubusercontent.com/ardu01/app-golf/main/icons/apple-touch-icon.png','icons/apple-touch-icon.png').replace('https://raw.githubusercontent.com/ardu01/app-golf/main/icons/icon-192.png','icons/icon-192.png').replace('https://raw.githubusercontent.com/ardu01/app-golf/main/icons/icon-512.png','icons/icon-512.png').replace('<title>Fairway</title>','<title>Fairway V3</title>'); p.write_text(t); print(p.stat().st_size)"
          wc -c index.html
      - name: Commit published V3
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "Publish depurated Fairway V3 to GitHub Pages"
          git push
