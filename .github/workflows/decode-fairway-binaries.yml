# DISABLED — Fairway 4.1 Phase 2 (2026-09-29).
#
# Why this file used to be dangerous:
#   on: workflow_dispatch
#   permissions: contents: write
#   It decoded every *.b64, deleted the sidecar, required count > 0,
#   then `git add -A`, commit, and `git push` of the checkout branch.
#   The Actions UI defaults that branch to main.
#
# The 4.0.11 tree has no *.b64, so the job would fail the count check
# before the commit. The button would still be live.
#
# This copy removes workflow_dispatch. It has no decode, no commit,
# and no git push. contents is read. The job is `if: false`.
#
# Until this change is merged, main still serves the old file.
# Do not restore workflow_dispatch or the decode/push steps.

name: Decode Fairway binaries (disabled)

on:
  push:
    branches:
      - "__disabled__/decode-fairway-binaries"

jobs:
  decode:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refused
        run: |
          echo "Disabled in Fairway 4.1 Phase 2."
          echo "This workflow would decode *.b64 and push the tree."
          echo "See docs/audit-4.1.md."
          exit 1
