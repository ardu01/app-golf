# DISABLED — Fairway 4.1 Phase 2 (2026-09-29).
#
# Why this file used to be dangerous:
#   on: workflow_dispatch
#   permissions: contents: write
#   If index.parts/ existed it concatenated those parts over index.html,
#   decoded every *.b64, then `git add -A`, commit, and `git push` of
#   the checkout branch. The Actions UI defaults that branch to main.
#
# The 4.0.11 tree has no index.parts and no *.b64, so a run with no
# diff would exit before the commit. The button would still be live.
#
# This copy removes workflow_dispatch. It has no assemble, no decode,
# no commit, and no git push. contents is read. The job is `if: false`.
#
# Until this change is merged, main still serves the old file.
# Do not restore workflow_dispatch or the assemble/push steps.

name: Assemble Fairway index (disabled)

on:
  push:
    branches:
      - "__disabled__/assemble-fairway-index"

jobs:
  assemble:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refused
        run: |
          echo "Disabled in Fairway 4.1 Phase 2."
          echo "This workflow would replace index.html from index.parts and push."
          echo "See docs/audit-4.1.md."
          exit 1
