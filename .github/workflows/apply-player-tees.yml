# DISABLED — Fairway 4.1 Phase 2 (2026-09-29).
#
# Why this file used to be dangerous:
#   on: workflow_dispatch
#   and on push of patches/player-tees.patch or this YAML
#   permissions: contents: write
#   If index.html did not contain function setPlayerTee, it ran
#   `git apply patches/player-tees.patch`, committed, and `git push`
#   of the checkout branch. The Actions UI defaults that branch to main.
#
# git apply --check of patches/player-tees.patch fails on the 4.0.11
# tree (index.html:1884). setPlayerTee is not in the product. A runner
# would fail at git apply before the commit, unless the patch started
# applying again. The dispatch button would still be live on main
# because GitHub serves workflow_dispatch from the default branch.
#
# This copy removes workflow_dispatch, so the file no longer offers a
# "Run workflow" button. It has no git apply, no commit, and no git push.
# contents is read. The job is also `if: false`.
#
# Until this change is merged, main still serves the old file.
# Do not restore workflow_dispatch or the apply/push steps.

name: Apply player tees patch (disabled)

on:
  push:
    branches:
      - "__disabled__/apply-player-tees"

jobs:
  apply:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refused
        run: |
          echo "Disabled in Fairway 4.1 Phase 2."
          echo "This workflow would apply patches/player-tees.patch and push."
          echo "See docs/audit-4.1.md."
          exit 1
