# The only workflow in this repo.
# Runs the unit suite. Does not deploy, does not git push, and does
# not download another app.
#
# GitHub Pages stays on the legacy branch publisher
# (dynamic/pages/pages-build-deployment, build_type legacy,
# source main /). That publisher is not a file in this repo.
# Do not add actions/deploy-pages beside it: the site would publish
# twice. See docs/rearme-4.1.4.md.
name: test-fairway

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/run.mjs
