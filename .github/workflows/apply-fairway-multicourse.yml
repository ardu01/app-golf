# DISABLED — Fairway 4.1 Phase 2 (2026-09-29).
#
# Why this file used to be dangerous:
#   on: workflow_dispatch AND push of ops/fairway-multicourse-patch/**
#   permissions: contents: write
#   steps that ran ops/fairway-multicourse-patch/apply.py, then
#   copied ops/fairway-multicourse-patch/sw.js over the repo sw.js
#   (cache name fairway-v159, skipWaiting on install, deletes every
#   other cache including fairway-maps-v1), committed index.html and
#   sw.js, and ran `git push` on the checked-out branch. A push to
#   main, or a dispatch that defaults to main, can replace production.
#
# This copy removes workflow_dispatch and the path push trigger.
# It has no apply.py, no copy of sw.js, no commit, and no git push.
# contents is read. The job is also `if: false`.
#
# GitHub reads workflow_dispatch from the default branch. Until this
# change is merged, main still serves the old file. Do not restore
# the push trigger or the sw.js copy.

name: Apply Fairway multi-course patch (disabled)

on:
  # Not workflow_dispatch. This branch name is not used by the repo.
  push:
    branches:
      - "__disabled__/apply-fairway-multicourse"

jobs:
  apply:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refused
        run: |
          echo "Disabled in Fairway 4.1 Phase 2."
          echo "This workflow would overwrite index.html and sw.js and push."
          echo "See docs/architecture.md."
          exit 1
