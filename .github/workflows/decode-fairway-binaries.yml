name: Decode Fairway binaries
on:
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode b64 sidecars
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            rm -f "$f"
            count=$((count+1))
            echo "decoded $out"
          done < <(find . -name '*.b64' -print0 | sort -z)
          echo "Decoded $count files"
          test "$count" -gt 0
      - name: Commit decoded binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Fairway lote1: decode webp/png binaries from b64 sidecars"
          git push
